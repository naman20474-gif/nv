<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />

    <title>Your Name — Full-Stack Developer & Builder</title>
    <meta
      name="description"
      content="Full-stack developer building fast, secure web experiences. React, Node.js, TypeScript and modern web tooling."
    />

    <link rel="canonical" href="https://yourdomain.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Your Name — Full-Stack Developer" />
    <meta
      property="og:description"
      content="I build fast, secure web experiences — from pixels to production."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:image" content="https://yourdomain.com/images/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: pinned families, swap so text is never invisible -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Graduate&family=Teko:wght@700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: who you are, machine-readable -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Your Name",
        "url": "https://yourdomain.com/",
        "jobTitle": "Full-Stack Developer",
        "knowsAbout": ["Web development", "React", "Node.js", "TypeScript", "Web security"],
        "sameAs": [
          "https://github.com/yourusername",
          "https://www.linkedin.com/in/yourusername/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
